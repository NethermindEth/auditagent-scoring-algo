# Hook environments use the same Python as .python-version.
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # Lint + autofix (includes isort via rule "I")
      - id: ruff
        args: [--config=pyproject.toml, --fix]

      # Formatter (Black-like)
      - id: ruff-format
        args: [--config=pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Same scope as CI (`mypy scoring_algo/`); tests are not type-checked.
        files: ^scoring_algo/
        additional_dependencies:
          [
            types-requests,
            types-PyYAML,
            types-setuptools,
            types-python-dateutil,
            "pydantic[mypy]==2.14.1",
            types-toml,
          ]
        args: [--config-file=pyproject.toml]
