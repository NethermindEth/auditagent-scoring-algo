# Hooks run the ruff and mypy pinned in uv.lock, the same ones CI uses, so there
# are no separate hook versions to keep in sync.
repos:
  - repo: local
    hooks:
      # Lint + autofix (includes isort via rule "I")
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      # Formatter (Black-like)
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      # Same command as CI: checks the whole package against the project env.
      - id: mypy
        name: mypy
        entry: uv run --locked mypy scoring_algo/
        language: system
        files: ^scoring_algo/
        pass_filenames: false
