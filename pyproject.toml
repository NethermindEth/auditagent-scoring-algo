[project]
name = "scoring-algo"
version = "0.1.0"
description = "Scoring algorithm to evaluate the accuracy of AI generated findings"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai==2.24.0",
    "python-dotenv==1.0.1",
    "typer==0.17.3",
    "rich==14.1.0",
    "orjson==3.11.3",
    "langfuse==3.1.3",
    "pydantic==2.11.7",
    "tiktoken==0.11.0",
    "pydantic-settings==2.6.1",
]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pydantic[mypy]>=2.11.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.1",
]

[project.scripts]
scoring-algo = "scoring_algo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scoring_algo"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".git", "__pycache__", "env", "venv", "build", "dist", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG"]
ignore = [
    "E501",   # line-too-long
    "B008",   # function-call-in-default-argument (typer pattern)
    "B904",   # raise-without-from-inside-except
    "SIM105", # contextlib.suppress - explicit try/except often clearer
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = "scoring_algo"
exclude = '''(?x)(
    ^\.git[\\/]|
    ^__pycache__[\\/]|
    ^\.venv[\\/]|
    ^venv[\\/]|
    ^dist[\\/]|
    ^build[\\/]|
    ^tests[\\/]
)'''
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = false


